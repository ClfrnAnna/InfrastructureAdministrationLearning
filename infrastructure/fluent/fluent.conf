# ============================================
# SOURCE: Читаем логи из файлов
# ============================================
<source>
  @type tail
  # Рекурсивный поиск всех .log файлов в подпапках
  # ** = ищет на любой глубине вложенности
  # Найдёт: main/gateway.log, modules/processor.log, any/deep/folder/app.log
  path /var/log/app/**/*.log
  # Файл позиции - запоминает до какой строки дочитали
  pos_file /tmp/app.log.pos
  # Тег для маршрутизации логов
  tag app.logs
  # Читать файлы с начала при первом запуске
  read_from_head true
  # Парсим JSON из каждой строки лога
  <parse>
    @type json
    time_key timestamp
    time_format %Y-%m-%dT%H:%M:%S.%L%z
    keep_time_key true
  </parse>
</source>

# ============================================
# FILTER: Добавляем дополнительные поля
# ============================================
<filter app.logs>
  @type record_transformer
  # Обогащаем каждую запись полем environment
  <record>
    environment dev
  </record>
  # Удаляем ненужные поля от Python логгера
  remove_keys taskName
</filter>

# ============================================
# OUTPUT: Отправляем логи в OpenSearch и MinIO
# ============================================
<match app.logs>
  # copy = дублируем логи в несколько назначений
  @type copy
  # ==========================================
  # Назначение 1: OpenSearch (поиск и аналитика)
  # ==========================================
  <store>
    @type opensearch
    # Подключение к OpenSearch
    host "#{ENV['OPENSEARCH_HOST']}"
    port "#{ENV['OPENSEARCH_PORT']}"
    index_name "dev_index"
    # Настройки буферизации для OpenSearch
    <buffer>
      @type memory                    # Буфер в RAM (быстро)
      flush_interval 5s               # Отправляем каждые 5 секунд
      retry_max_times 3               # Повторяем 3 раза при ошибке
      chunk_limit_size 2M             # Размер порции данных
    </buffer>
  </store>

  # ==========================================
  # Назначение 2: MinIO (долгосрочное хранение)
  # ==========================================
  <store>
    @type s3
    # Креды для MinIO (S3-compatible)
    aws_key_id "#{ENV['MINIO_ACCESS_KEY']}"
    aws_sec_key "#{ENV['MINIO_SECRET_KEY']}"
    s3_endpoint "#{ENV['S3_ENDPOINT']}"
    s3_bucket "#{ENV['S3_BUCKET']}"
    s3_region us-east-1
    # Для MinIO обязательно использовать path-style URL
    force_path_style true
    # Структура папок в S3: app-logs-2025-01-12/
    path "app-logs-%Y-%m-%d/"
    # Настройки буферизации для S3
    <buffer time>
      @type file                      # Буфер на диске (не теряем при сбое)
      path /fluentd/buffer/s3
      timekey 600
      timekey_wait 10s
      chunk_limit_size 256m           # Макс размер файла в буфере
    </buffer>
    # Формат данных в S3
    <format>
      @type json                      # Сохраняем как JSON
    </format>
    # СЖАТИЕ: GZIP архив
    store_as gzip
  </store>
</match>
