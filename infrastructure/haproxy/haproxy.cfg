global
    daemon
    stats socket /tmp/haproxy.sock mode 600 level admin
    log stdout format raw daemon

defaults
    mode tcp
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 10s
    default-server init-addr none
    log global

# ============================================
# HAProxy Statistics
# ============================================
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# ============================================
# PostgreSQL Cluster (мастер и слейв)
# ============================================
listen postgres
    mode tcp
    bind *:5432
    server pg-master pg-master:5432
    server pg-slave pg-slave:5432

# ============================================
# FastAPI Application Cluster
# ============================================
listen fastapi
    mode http
    bind *:8000
    server fastapi-app1 fastapi-app1-container:8000 check
    server fastapi-app2 fastapi-app2-container:8000 check

# ============================================
# Order Processor
# ============================================
listen order-processor
    mode http
    bind *:8001
    server order-processor order-processor:8000

