defaults
    mode tcp
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# ============================================
# HAProxy Statistics
# ============================================
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# ============================================
# PostgreSQL Cluster
# ============================================
listen postgres
    mode tcp
    bind *:5432
    server postgresql_master_5432 pg-master:5432 check inter 3s fall 3 rise 2
    server postgresql_slave_5432 pg-slave:5432 check inter 3s fall 3 rise 2
# ============================================
# FastAPI Application Cluster
# ============================================
listen fastapi
    mode http
    bind *:8000
    option httpchk GET /healthy
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 init-addr none
    server fastapi-app1 fastapi-app1-container:8000 check
    server fastapi-app2 fastapi-app2-container:8000 check

# ============================================
# Order Processor
# ============================================
listen order-processor
    mode http
    bind *:8001
    option httpchk GET /docs
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 init-addr none
    server order-processor order-processor-container:8000 check
