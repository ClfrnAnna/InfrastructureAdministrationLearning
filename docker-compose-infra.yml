services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq-container
    restart: always
    env_file:
      - .env
    networks:
      - rabbitmq-network
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: always
    env_file:
      - .env
    networks:
      - rabbitmq-network
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  pg-master:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile.postgres
    image: local-postgres:patroni
    container_name: pg-master
    hostname: pg-master
    env_file:
      - .env
    expose:
      - 8008
    ports:
      - "5433:5432"
    volumes:
      - pg-master:/var/lib/postgresql/data
    networks:
      - postgres-cluster
    command: patroni /postgres0.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  pg-slave:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile.postgres
    image: local-postgres:patroni
    container_name: pg-slave
    hostname: pg-slave
    env_file:
      - .env
    expose:
      - 8008
    ports:
      - "5434:5432"
    volumes:
      - pg-slave:/var/lib/postgresql/data
    networks:
      - postgres-cluster
    command: patroni /postgres1.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  zoo:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zoo
    hostname: zoo
    ports:
      - "2181:2181"
    networks:
      - postgres-cluster
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  haproxy:
    image: haproxy:3.0
    container_name: api-gateway
    ports:
      - "5432:5432"   # write
      - "5435:5433"   # read
      - "7000:7000"
      - "8000:8000"
    depends_on:
      pg-master:
        condition: service_started
      pg-slave:
        condition: service_started
      zoo:
        condition: service_healthy
    volumes:
      - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - postgres-cluster
      - app1-network
      - app2-network
    restart: always
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: minio-container
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

volumes:
  rabbitmq-data:
  redis-data:
  pg-master:
  pg-slave:
  minio-data:

networks:
  rabbitmq-network:
    driver: bridge
  app1-network:
    driver: bridge
  app2-network:
    driver: bridge
  postgres-cluster:
    driver: bridge