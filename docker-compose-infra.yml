services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq-container
    restart: always
    env_file:
      - .env
    networks:
      - rabbitmq-network
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"

  redis:
    image: redis:7-alpine
    container_name: redis-container
    restart: always
    env_file:
      - .env
    networks:
      - rabbitmq-network
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

  pg-master:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile.postgres
    image: local-postgres:patroni
    container_name: pg-master
    hostname: pg-master
    env_file:
      - .env
    expose:
      - 8008
    ports:
      - "5433:5432"
    volumes:
      - pg-master:/var/lib/postgresql/data
    networks:
      - postgres-cluster
    command: patroni /postgres0.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  pg-slave:
    build:
      context: ./infrastructure/postgres
      dockerfile: Dockerfile.postgres
    image: local-postgres:patroni
    container_name: pg-slave
    hostname: pg-slave
    env_file:
      - .env
    expose:
      - 8008
    ports:
      - "5434:5432"
    volumes:
      - pg-slave:/var/lib/postgresql/data
    networks:
      - postgres-cluster
    command: patroni /postgres1.yml
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 40s

  zoo:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: zoo
    hostname: zoo
    ports:
      - "2181:2181"
    networks:
      - postgres-cluster
    env_file:
      - .env
      - .env.infra
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  haproxy:
    image: haproxy:3.0
    container_name: api-gateway
    ports:
      - "5432:5432"   # write
      - "5435:5433"   # read
      - "7000:7000"
      - "8000:8000"
    depends_on:
      pg-master:
        condition: service_started
      pg-slave:
        condition: service_started
      zoo:
        condition: service_healthy
    volumes:
      - ./infrastructure/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - postgres-cluster
      - app1-network
      - app2-network
    restart: always
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  minio:
    image: minio/minio:latest
    container_name: minio-container
    command: server /data --console-address ":9001"
    env_file:
      - .env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - app1-network
      - app2-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    env_file:
      - .env.infra
    ports:
      - "9200:9200"
    expose:
      - "9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - logging-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9200" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  fake-kibana:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: fake-kibana
    ports:
      - "5601:5601"
    env_file:
      - .env.infra
    depends_on:
      - opensearch
    networks:
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5601/api/status" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: prom/prometheus:v2.48.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    networks:
      - app1-network
      - app2-network
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    env_file:
      - .env.infra
    depends_on:
      - prometheus
      - opensearch
    networks:
      - app1-network
      - app2-network
      - logging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis-container:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "9121:9121"
    networks:
      - app1-network
      - app2-network
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_PASSWORD}@pg-master:5432/postgres?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - postgres-cluster
      - app1-network
    restart: unless-stopped
    depends_on:
      - pg-master
    healthcheck:
      test: [ "CMD", "sh", "-c", "ps aux | grep -v grep | grep -q postgres_exporter" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  rabbitmq-data:
  redis-data:
  pg-master:
  pg-slave:
  minio-data:
  opensearch-data:

networks:
  rabbitmq-network:
    driver: bridge
  app1-network:
    driver: bridge
  app2-network:
    driver: bridge
  postgres-cluster:
    driver: bridge
  logging-network:
    driver: bridge