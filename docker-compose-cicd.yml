x-common-settings: &common-settings
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  gitlab:
    <<: *common-settings
    image: gitlab/gitlab-ce:18.6.0-ce.0
    container_name: gitlab
    hostname: gitlab
    ports:
      - "8888:8888"
    volumes:
      - ./infrastructure/gitlab/gitlab-config.rb:/etc/gitlab/gitlab.rb:ro
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
      - gitlab-logs:/var/log/gitlab
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8888/-/health"]
      start_period: 120s
    mem_limit: 4g
    mem_reservation: 2g
    networks:
      - cicd-network

  gitlab-runner:
    <<: *common-settings
    image: gitlab/gitlab-runner:alpine3.21
    container_name: gitlab-runner
    network_mode: "host"
    env_file:
      - .env.runner
    volumes:
      - gitlab-runner-data:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitlab:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "gitlab-runner", "status"]
      start_period: 10s
    mem_limit: 512m
    mem_reservation: 256m

volumes:
  gitlab-config:
  gitlab-data:
  gitlab-logs:
  gitlab-runner-data:

networks:
  cicd-network:
    driver: bridge
    name: cicd-network