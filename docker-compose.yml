services:
  fastapi-app1:
    build:
      context: ./services/fastapi
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
    image: fastapi-app:${APP_VERSION}
    container_name: fastapi-app1-container
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8000"
    volumes:
      - app1-data:/app/data:rw
    networks:
      - fastapi-net-1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  fastapi-app2:
    build:
      context: ./services/fastapi
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
    image: fastapi-app:${APP_VERSION}
    container_name: fastapi-app2-container
    restart: always
    env_file:
      - .env
    ports:
      - "8004:8000"
    volumes:
      - app2-data:/app/data:rw
    networks:
      - fastapi-net-2
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  health-checker-app:
    build:
      context: ./services/healthchecker
      dockerfile: Dockerfile.healthchecker
    image: health-checker:${APP_VERSION}
    container_name: health-checker-app-container
    restart: on-failure
    env_file:
      - .env
    networks:
      - fastapi-net-1
      - fastapi-net-2
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/healthy')" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      fastapi-app1:
        condition: service_healthy
      fastapi-app2:
        condition: service_healthy

  order-processor:
    build:
      context: ./services/order_processor
      dockerfile: Dockerfile.processor
    image: order-processor:local
    container_name: order-processor-container
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    networks:
      - order-processor-net
    stdin_open: true
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/docs" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      haproxy:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
      init-minio:
        condition: service_completed_successfully

  init-db:
    build:
      context: ./services/init_db
      dockerfile: Dockerfile
    container_name: init-db-container
    restart: "no"
    env_file:
      - .env
    environment:
      ORDERS_DB_HOST: pg-master
    networks:
      - order-processor-net
    depends_on:
      haproxy:
        condition: service_healthy
      pg-master:
        condition: service_healthy

  init-minio:
    build:
      context: ./services/init_minio
      dockerfile: Dockerfile
    container_name: init-minio-container
    restart: "no"
    env_file:
      - .env
    networks:
      - order-processor-net
    depends_on:
      minio:
        condition: service_started

volumes:
  app1-data:
    driver: local
  app2-data:
    driver: local

networks:
  fastapi-net-1:
    driver: bridge
  fastapi-net-2:
    driver: bridge
  order-processor-net:
    driver: bridge
