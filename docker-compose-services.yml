x-common-settings: &common-settings
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  fastapi-app1:
    <<: *common-settings
    build:
      context: ./services/fastapi
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
    image: fastapi-app:${APP_VERSION}
    container_name: fastapi-app1-container
    env_file:
      - .env
      - .env.services
    volumes:
      - app1-data:/app/data:rw
      - ./logs:/app/log:rw
    networks:
      - app1-network
    environment:
      - CONTAINER_NAME=fastapi-app1-container
      - APP_INSTANCE=1
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthy"]

  fastapi-app2:
    <<: *common-settings
    build:
      context: ./services/fastapi
      dockerfile: Dockerfile
      args:
        - APP_VERSION=${APP_VERSION}
    image: fastapi-app:${APP_VERSION}
    container_name: fastapi-app2-container
    env_file:
      - .env
      - .env.services
    volumes:
      - app2-data:/app/data:rw
      - ./logs:/app/log:rw
    networks:
      - app2-network
    environment:
      - CONTAINER_NAME=fastapi-app2-container
      - APP_INSTANCE=2
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthy"]

  order-processor:
    <<: *common-settings
    build:
      context: ./services/order_processor
      dockerfile: Dockerfile.processor
    image: order-processor:${APP_VERSION}
    container_name: order-processor-container
    env_file:
      - .env
      - .env.services
    volumes:
      - ./logs:/app/log:rw
    networks:
      - app1-network
      - app2-network
    environment:
      - CONTAINER_NAME=order-processor-container
    ports:
      - "8001:8000"
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthy"]

  health-checker-app:
    <<: *common-settings
    build:
      context: ./services/healthchecker
      dockerfile: Dockerfile.healthchecker
    image: health-checker:${APP_VERSION}
    container_name: health-checker-app-container
    restart: on-failure:5
    env_file:
      - .env
      - .env.services
    networks:
      - app1-network
      - app2-network
    stdin_open: true
    tty: true

  init-db:
    build:
      context: ./services/init_db
      dockerfile: Dockerfile
    image: init-db:${APP_VERSION}
    container_name: init-db-container
    env_file:
      - .env
      - .env.services
    networks:
      - app1-network
    restart: "no"

  init-minio:
    build:
      context: ./services/init_minio
      dockerfile: Dockerfile
    image: init-minio:${APP_VERSION}
    container_name: init-minio-container
    env_file:
      - .env
      - .env.services
    networks:
      - app1-network
    restart: "no"

  my-service:
    <<: *common-settings
    build:
      context: ./services/my_service
      dockerfile: Dockerfile
    container_name: my-service-container
    env_file:
      - .env
      - .env.services
    environment:
      - CONTAINER_NAME=my-service-container
    volumes:
      - ./logs:/app/log:rw
    networks:
      - app1-network
      - app2-network
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep python.*app.py || exit 1"]
      start_period: 10s

  fluentd:
    <<: *common-settings
    build:
      context: ./infrastructure/fluent
      dockerfile: Dockerfile.fluentd
    container_name: fluentd
    volumes:
      - ./infrastructure/fluent/fluent.conf:/fluentd/etc/fluent.conf
      - ./logs:/var/log/app:ro
    env_file:
      - .env-fluentd
    networks:
      - app1-network
      - app2-network
      - logging-network
    depends_on:
      - fastapi-app1
      - fastapi-app2
      - order-processor
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "sh", "-c", "ps aux | grep -v grep | grep fluentd"]
      start_period: 10s

volumes:
  app1-data:
  app2-data:

networks:
  app1-network:
    driver: bridge
    name: app1-network
  app2-network:
    driver: bridge
    name: app2-network
  logging-network:
    driver: bridge
    name: logging-network