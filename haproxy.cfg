defaults
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

# ============================================
# HAProxy Statistics
# ============================================
listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

# ============================================
# PostgreSQL Cluster
# ============================================
listen postgres
    mode tcp
    bind *:5432
    option httpchk
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server postgresql_master_5432 pg-master:5432 maxconn 100 check port 8008
    server postgresql_slave_5432 pg-slave:5432 maxconn 100 check port 8008

# ============================================
# FastAPI Application Cluster (две реплики)
# ============================================
listen fastapi
    mode http
    bind *:8000
    option httpchk GET /healthy
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server fastapi-app1 fastapi-app1-container:8000 check
    server fastapi-app2 fastapi-app2-container:8000 check
